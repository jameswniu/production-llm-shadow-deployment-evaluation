<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="100%" role="img" aria-label="Shadow deployment for LLM workflows: scoreboard and the four rungs">
<rect width="1200" height="524" rx="12" fill="#041c1c"/>
<text x="48" y="54" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#C7A96B" letter-spacing="2">SHADOW DEPLOYMENT FOR LLM WORKFLOWS</text>
<text x="48" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" fill="#ffe6cb" font-weight="700">A new model earns production</text>
<text x="48" y="164" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" fill="#ffe6cb" font-weight="700">in the shadow of the old one</text>
<text x="48" y="212" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#C7A96B">Same incidents, same rulebook, no tools. A sequential test says promote,</text>
<text x="48" y="244" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#C7A96B">keep shadowing or reject, one job family at a time.</text>
