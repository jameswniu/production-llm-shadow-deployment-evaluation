<text x="70" y="356" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#C7A96B">held-out incidents</text>
<rect x="372" y="270" width="378" height="124" rx="8" fill="#0b2f2f" stroke="#B8860B" stroke-width="1.5"/>
<rect x="380" y="270" width="362" height="5" fill="#FFBF00"/>
<text x="394" y="324" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#ffe6cb" font-weight="700">52 / 62</text>
<text x="394" y="356" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#C7A96B">ops agreements</text>
<text x="394" y="386" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#C7A96B">keep shadowing</text>
<rect x="774" y="270" width="378" height="124" rx="8" fill="#0b2f2f" stroke="#B8860B" stroke-width="1.5"/>
<rect x="782" y="270" width="362" height="5" fill="#d14a4a"/>
<text x="796" y="324" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#ffe6cb" font-weight="700">26 / 38</text>
<text x="796" y="356" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#C7A96B">render agreements</text>
<text x="796" y="386" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#C7A96B">rejected</text>
<rect x="48" y="424" width="378" height="44" rx="8" fill="#FFBF00"/>
<text x="64" y="454" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#041c1c" font-weight="700">1 shadow, logs handed over</text>
