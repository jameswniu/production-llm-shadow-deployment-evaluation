<rect x="700" y="424" width="245" height="44" rx="8" fill="none" stroke="#B8860B" stroke-width="2"/>
<text x="716" y="454" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#ffe6cb">3 live diagnosis</text>
<rect x="953" y="424" width="192" height="44" rx="8" fill="none" stroke="#B8860B" stroke-width="2"/>
<text x="969" y="454" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#ffe6cb">4 the switch</text>
<text x="48" y="508" font-family="SF Mono, Menlo, Consolas, monospace" font-size="23" fill="#C7A96B">python3 shadow-medic/compare.py scoreboard --family ops | --family render</text>
