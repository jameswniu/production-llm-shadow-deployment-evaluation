<text x="70" y="356" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">held-out incidents</text>
<rect x="372" y="270" width="378" height="124" rx="0" fill="#171c24" stroke="#2c333d" stroke-width="2"/>
